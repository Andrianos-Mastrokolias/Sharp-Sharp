<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <base href="/">
  <title>GL harness</title>
  <style>html,body{margin:0;background:#000}</style>
</head>
<body>
<script>
// Frozen clock (window.setTime(ms) moves it) so animated things, like the
// pedestrians' walk, are identical on every run.
window.__now = 20000;
performance.now = () => window.__now;
window.setTime = (ms) => { window.__now = ms; };

// Seeded Math.random so stars / particles are identical on every run.
(function () { let a = 1234567; Math.random = function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; })();
</script>
<script type="module">
// Dev tool (see tests/tools/README.md): renders one level's environment from
// fixed cameras so draw calls / triangles (renderer.info, shadow pass
// included) and screenshots can be compared before and after a change.
import * as THREE from 'three';
import { LightingManager } from '/src/graphics/LightingManager.js';
import { SkyManager } from '/src/graphics/SkyManager.js';
import { MaterialLibrary } from '/src/graphics/MaterialLibrary.js';
import { buildEnvironment } from '/src/world/environments/index.js';
import { cameras, FOV, ASPECT } from '/tests/tools/cameras.mjs';

const W = 1280, H = 720;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, ASPECT, 0.1, 1000);
const lighting = new LightingManager({ scene, renderer });
const sky = new SkyManager({ scene, renderer });
const materials = new MaterialLibrary(renderer);

let env = null;

window.loadLevel = async (level) => {
  if (env) { env.dispose(); env = null; }
  lighting.setLevel(level);
  sky.setLevel(level);
  env = buildEnvironment(level, { materials });
  scene.add(env.group);
  await sleep(4000);                       // textures + HDRI
  return { collidables: env.collidables.length };
};

// Renders until two consecutive frames are byte-identical (textures and the
// HDRI decode asynchronously), then reports renderer.info for that frame.
window.cameraNames = (level) => cameras(level).map((c) => c.name);

window.shot = async (level, index) => {
  const c = cameras(level)[index];
  camera.position.set(...c.at);
  camera.lookAt(...c.to);
  camera.updateMatrixWorld(true);
  let last = null;
  for (let i = 0; i < 40; i++) {
    renderer.render(scene, camera);
    const png = renderer.domElement.toDataURL('image/png');
    if (png === last) break;
    last = png;
    await sleep(400);
  }
  renderer.render(scene, camera);
  const { calls, triangles } = renderer.info.render;
  return { name: c.name, calls, triangles, png: renderer.domElement.toDataURL('image/png') };
};

// Per-pixel difference of two PNG data URLs (same size).
window.diff = async (a, b) => {
  const load = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.src = src; });
  const px = async (src) => {
    const i = await load(src);
    const c = document.createElement('canvas'); c.width = i.width; c.height = i.height;
    const g = c.getContext('2d'); g.drawImage(i, 0, 0);
    return g.getImageData(0, 0, i.width, i.height);
  };
  const A = await px(a), B = await px(b);
  const w = A.width, h = A.height;
  const out = new ImageData(w, h);
  let max = 0, sum = 0, differing = 0, over8 = 0;
  const grid = Array.from({ length: 3 }, () => Array(4).fill(0));
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const p = (y * w + x) * 4;
    let d = 0;
    for (let k = 0; k < 3; k++) { const e = Math.abs(A.data[p + k] - B.data[p + k]); sum += e; if (e > d) d = e; }
    if (d > max) max = d;
    if (d > 0) differing++;
    if (d > 8) {
      over8++;
      grid[Math.floor(y / (h / 3))][Math.floor(x / (w / 4))]++;
      x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
    }
    const v = Math.min(255, d * 8);
    out.data[p] = v; out.data[p + 1] = v; out.data[p + 2] = v; out.data[p + 3] = 255;
  }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').putImageData(out, 0, 0);
  return {
    max, mean: sum / (w * h * 3), differingPixels: differing, over8Pixels: over8,
    bboxOver8: over8 ? [x0, y0, x1, y1] : null, gridOver8_3x4: grid, png: c.toDataURL('image/png')
  };
};

window.__ready = true;
</script>
</body>
</html>
